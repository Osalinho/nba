name: Codzienna aktualizacja NBA Łamaki

on:
  schedule:
    # 6:00 UTC = 7:00 lub 8:00 czasu polskiego (zależnie od czasu letniego/zimowego)
    - cron: '0 6 * * *'
  workflow_dispatch: {}  # pozwala też odpalić ręcznie z zakładki Actions na GitHubie

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacja zależności
        run: pip install -r requirements.txt

      - name: Pobierz nowe mecze
        run: python scripts/fetch_new_games.py --days-back 4

      - name: Przelicz dane (klasyfikacja łamaków, streaki, kontekst)
        run: python scripts/enrich.py

      - name: Zbuduj stronę (index.html)
        run: python scripts/build_site.py

      - name: Commit i push jeśli są zmiany
        run: |
          git config user.name "nba-lamaki-bot"
          git config user.email "actions@github.com"
          git add data/games_all.json data/enriched_data.json index.html
          if git diff --cached --quiet; then
            echo "Brak nowych meczów - nic do commitowania."
          else
            git commit -m "Automatyczna aktualizacja danych $(date -u +%Y-%m-%d)"
            git push
          fi
