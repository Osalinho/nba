name: Codzienna aktualizacja NBA Łamaki

on:
  schedule:
    # GitHub liczy cron w UTC, a przebiegi potrafią się spóźniać nawet o kilka godzin - dlatego BEZ "bramki czasu".
    # Docelowo 8:00 czasu polskiego: 7:00 UTC zimą (CET) / 6:00 UTC latem (CEST) - odpalamy oba terminy,
    # a trzeci (11:00 UTC) to siatka bezpieczeństwa. Przebieg bez nowych meczów nic nie psuje (nic nie commituje poza statusem).
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
    - cron: '0 11 * * *'
  workflow_dispatch: {}  # ręczne odpalenie: Actions -> Run workflow
  push:
    paths: ['data/inbox/**']  # plan B: wrzucenie zapisanej strony (data/inbox/regular.html) od razu uruchamia przebieg

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacja zależności
        run: pip install -r requirements.txt

      # --- SEZON ZASADNICZY: wyniki + terminarz z en.24score.com (to samo źródło co cała historia) ---
      - name: Pobierz wyniki sezonu zasadniczego z 24score
        id: regular
        continue-on-error: true
        run: python scripts/fetch_regular_24score.py

      # --- PRESEASON ---
      - name: Pobierz wyniki preseason z 24score
        continue-on-error: true
        run: python scripts/fetch_preseason_24score.py

      # Przebudowa całej strony (statystyki) tylko gdy są nowe mecze / zmieniony terminarz.
      # Same wyniki i status strona dociąga na żywo z data/*.json, więc widać je od razu po commicie.
      - name: Przelicz dane i zbuduj stronę (tylko gdy są zmiany)
        run: |
          if [ "$(cat data/.last_update_had_changes 2>/dev/null)" = "1" ]; then
            python scripts/enrich.py
            python scripts/build_site.py
          else
            echo "Brak nowych meczów sezonu - pomijam przebudowę strony."
          fi

      - name: Commit i push
        run: |
          git config user.name "nba-lamaki-bot"
          git config user.email "actions@github.com"
          # enriched_data.json (ok. 28 MB) powstaje na nowo przy każdej przebudowie - nie commitujemy go
          git add data/preseason_results.json data/games_all.json data/fixtures_2026_27.json data/update_status.json index.html
          if git diff --cached --quiet; then
            echo "Brak zmian - nic do commitowania."
          else
            git commit -m "Automatyczna aktualizacja danych $(date -u +%Y-%m-%d\ %H:%M)"
            git pull --rebase --autostash
            git push
          fi

      # Przebieg ma być CZERWONY, gdy pobieranie się nie udało - wtedy GitHub wyśle Ci maila i od razu widać problem.
      - name: Sprawdź, czy pobieranie się udało
        run: |
          python - <<'PY'
          import json, sys
          st = json.load(open('data/update_status.json', encoding='utf-8'))
          print(st)
          if not st.get('ok'):
              print('::error::Pobieranie wyników NIE powiodło się: ' + str(st.get('error')))
              sys.exit(1)
          PY
